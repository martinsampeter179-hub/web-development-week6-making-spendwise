<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendWise - Interactive Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>SpendWise</h1>
      <p>Track your spending and make smart decisions.</p>
    </header>

    <!-- Dashboard Summary -->
    <section class="dashboard">
      <div class="card">
        <h3>Total Expenses</h3>
        <p id="total-expense-display">$0.00</p>
      </div>
      <div class="card">
        <h3>Total Items</h3>
        <p id="total-count-display">0</p>
      </div>
    </section>

    <!-- Budget Alert Banner -->
    <div id="budget-alert" class="alert hidden"></div>

    <!-- Form Section -->
    <section class="form-section">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label for="expense-name">Expense Name</label>
          <input type="text" id="expense-name" placeholder="e.g. Groceries" required>
        </div>
        <div class="form-group">
          <label for="expense-amount">Amount ($)</label>
          <input type="number" id="expense-amount" placeholder="e.g. 45.00" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Utilities">Utilities</option>
            <option value="Shopping">Shopping</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" id="add-btn">Add Expense</button>
      </form>
    </section>

    <!-- Expense List Section -->
    <section class="list-section">
      <h2>Expense History</h2>
      <table class="expense-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="expense-table-body">
          <!-- Dynamically populated via script.js -->
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
